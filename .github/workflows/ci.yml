name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  # Everything that does not need a browser. Fast, and the first gate.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the content
        run: npm run validate

      - name: Generate the content module
        run: npm run generate:content

      - name: The generated content module is committed in sync
        run: git diff --exit-code src/data/generated.ts

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: The build size is inside the budget
        run: |
          total=$(du -sb dist | cut -f1)
          echo "dist is $total bytes"
          test "$total" -lt 3600000

  # One browser per job. Installing three browsers in one job is slow and
  # makes one flaky install hold up all three suites.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 3
