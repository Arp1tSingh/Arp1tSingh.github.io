<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000016"/>
  <!-- The period is the brand mark: accent red on navy, matching the site's
       one-accent rule. Kept as a shape rather than a glyph so it stays legible
       at 16px where a letterform would not. -->
