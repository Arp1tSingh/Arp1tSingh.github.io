<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#f7f2ea" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <mask id="edgefade">
      <rect width="1200" height="630" fill="url(#fade)"/>
    </mask>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/><stop offset="92%" stop-color="#000"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0a09"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- faint monogram, top right -->
  <g opacity=".22" filter="url(#glow)">
    <path d="M1010 60 L1076 190 L1142 60" fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- eyebrow -->
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <circle cx="86" cy="150" r="5" fill="#ff5a1f"/>
    <text x="104" y="156" fill="#ff5a1f" font-size="19" letter-spacing="4.2">OPEN TO TECH INTERNSHIPS — 2026</text>
  </g>

  <!-- name, Instrument Serif -->
  <text x="80" y="300" font-family="Instrument Serif, Times New Roman, serif" font-size="128" letter-spacing="-3" fill="#f7f2ea">Arpit Singh</text>

  <!-- role -->
  <text x="80" y="366" font-family="JetBrains Mono, ui-monospace, monospace" font-size="26" fill="#a89f94" letter-spacing="2.6">FULL-STACK · AI/ML · SYSTEMS</text>

  <!-- hairline rule -->
  <rect x="80" y="404" width="1040" height="1" fill="#f7f2ea" fill-opacity=".14"/>

  <!-- description -->
  <text x="80" y="452" font-family="Inter Tight, Helvetica, sans-serif" font-size="27" fill="#a89f94">Deepfake detection with Grad-CAM, a CPU path tracer written from scratch,</text>
  <text x="80" y="490" font-family="Inter Tight, Helvetica, sans-serif" font-size="27" fill="#a89f94">an FSRS-6 spaced repetition tracker, and a P2P transfer network.</text>

  <!-- stat blocks, spec-sheet style -->
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <g transform="translate(80,528)">
      <text x="0" y="30" fill="#f7f2ea" font-size="40">248</text>
      <text x="0" y="58" fill="#7a7268" font-size="15" letter-spacing="2.4">COMMITS</text>
    </g>
    <g transform="translate(240,528)">
      <text x="0" y="30" fill="#f7f2ea" font-size="40">16</text>
      <text x="0" y="58" fill="#7a7268" font-size="15" letter-spacing="2.4">REPOSITORIES</text>
    </g>
    <g transform="translate(430,528)">
      <text x="0" y="30" fill="#f7f2ea" font-size="40">5</text>
      <text x="0" y="58" fill="#7a7268" font-size="15" letter-spacing="2.4">LIVE DEMOS</text>
    </g>
    <g transform="translate(570,528)">
      <text x="0" y="30" fill="#f7f2ea" font-size="40">7</text>
      <text x="0" y="58" fill="#7a7268" font-size="15" letter-spacing="2.4">LANGUAGES</text>
    </g>
  </g>

  <text x="1120" y="586" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" fill="#4a453e" letter-spacing="1.5">arp1tsingh.github.io</text>
</svg>