    <script>
      // Arm the app, and keep a way back to the static page.
      // If the app never boots, the timer puts the classic view back.
      document.documentElement.classList.add('js-armed');
      window.__local3dFallback = window.setTimeout(function () {
        if (!window.__local3dBooted) {
          document.documentElement.classList.remove('js-armed');
        }
      }, 2500);
    </script>
